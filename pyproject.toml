[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autorsr-inference"
version = "0.1.0"
description = "Four-class ultra-wide-field fundus segmentation inference for AutoRSR"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.21,<3", "opencv-python-headless>=4.5,<5", "torch>=1.10"]

[project.scripts]
autorsr-infer = "autorsr.inference:main"

[tool.setuptools.packages.find]
include = ["autorsr*"]
